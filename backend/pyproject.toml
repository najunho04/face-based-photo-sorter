[project]
name = "photo-sorter-backend"
version = "0.1.0"
description = "행사 사진 얼굴 분류·셀카 매칭 백엔드 (API 서버 + 워커)"
# insightface·onnxruntime 휠 호환성이 검증된 버전으로 고정 (.python-version과 같이 관리)
requires-python = ">=3.12,<3.13"
dependencies = [
    # API 서버
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",   # 사진·셀카 multipart 업로드
    "pydantic-settings>=2.4",    # backend/.env 읽기
    "pyjwt>=2.9",                # 관리자·참가자 JWT
    # DB: SQLAlchemy ORM + psycopg 드라이버
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",             # VECTOR(512) 컬럼 타입 (pgvector.sqlalchemy)
    # Object Storage (NCP는 S3 호환)
    "boto3>=1.35",
    "numpy>=1.26",               # 벡터 연산 (pgvector 변환, 분류)
    # 얼굴 검출·임베딩 (extraction/, matching/): InsightFace buffalo_l, onnxruntime은 insightface가 함께 설치
    # OpenCV는 서버에 화면이 없어 GUI 기능을 뺀 headless 버전 사용
    "insightface>=2.1",
    "opencv-python-headless>=4.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2>=2.16.0",            # FastAPI TestClient (Starlette가 httpx 대신 요구)
    "moto[s3]>=5",               # Object Storage(S3 호환)를 메모리에서 흉내 (테스트에 NCP 키 불필요)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# backend/를 import 기준으로 둬서 테스트에서 `import core`처럼 도메인 폴더를 바로 가져옴
pythonpath = ["."]
