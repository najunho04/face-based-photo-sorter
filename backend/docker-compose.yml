# 로컬 개발·테스트용 환경 (backend/에서 docker compose up -d). 지금은 DB만 띄우고, api·worker 서비스는 구현되면 추가
# 폴더명(backend) 대신 프로젝트 이름을 고정해 볼륨·네트워크 이름이 알아보기 쉽게 함
name: photo-sorter

services:
  database:
    # PostgreSQL 공식 이미지에는 pgvector가 없어서 pgvector 공식 이미지 사용 (VECTOR(512) 컬럼 필요)
    # 운영 NCP Cloud DB for PostgreSQL이 16이라 메이저 버전을 맞춤
    image: pgvector/pgvector:pg16
    container_name: photo-sorter-database
    # DB 이름·계정은 백엔드와 같은 파일에서 읽어 값이 어긋나지 않게 함 (없으면 cp .env.example .env)
    env_file:
      - ./.env
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 16 이미지의 데이터 경로 (18부터는 /var/lib/postgresql로 바뀌니 버전 올릴 때 같이 수정)
      - database-data:/var/lib/postgresql/data
      # 볼륨이 비어 있는 첫 실행 때만 migrations의 .sql을 파일명 순서대로 실행
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 테스트가 DB 준비 전에 붙지 않도록 접속 가능 여부를 확인
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  database-data:
